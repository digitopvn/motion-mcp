id: cinematic-technology
name: Cinematic Technology
family: brand-inspired
aliases: [sony, sony-like, sony-style, imaging tech film]
summary: Filmmaker-grade tech film; anamorphic light, rack-focus reveals, deep blacks and elegant thin type over imagery.
energy: 3
best_for: [imaging-product, audio-product, creator-tools, premium-brand-film]
character: >-
  Made by and for image-makers: deep contrasty blacks, anamorphic streaks,
  rack-focus pulls from foreground to product and elegant thin type that sits
  on top of imagery like a film credit. Crafted, sensory and cinematic.
dimensions:
  palette:
    mode: dark
    colors: {bg: "#050608", ink: "#f0f0f0", accent: "#4da3ff", warm: "#f2a65a", steel: "#2a2e35", mute: "rgba(240,240,240,0.55)"}
    rule: "Imagery carries colour, graded teal-orange; accent blue only for anamorphic streaks and a single UI highlight."
  typography:
    - "Manrope 300 headlines 64 px, +0.04em tracking, credit-like"
    - "Manrope 600 for short labels; IBM Plex Mono 400 for camera settings (f/1.4, 1/250, ISO)"
    - "Be Vietnam Pro 500 for captions"
  layout:
    - "Full-bleed imagery (stills with slow scale/pan; footage only with supplied clips and a verified HyperFrames video path); text lower-left like an end credit"
    - "Letterbox 2.0:1 on film shots, full 16:9 on UI"
  material: ["Matte black product with fine specular rims", "No cards; UI shown in a thin 1 px frame"]
  texture: ["Baked PNG anamorphic streak sprites", "Fine grain 4%", "Bokeh plates from seeded rng circles baked to PNG"]
  camera:
    - "Rack focus: foreground layer blur 0 -> 12 px while product layer 12 -> 0 over 1 s (only two filtered layers)"
    - "Slow dolly-in 1.0 -> 1.05 and gentle parallax on layered plates"
  transitions: ["rack-focus handoff (outgoing blurs while incoming sharpens, 0.8 s)", "anamorphic streak wipe (horizontal blue flare crosses frame 0.35 s)", "shutter close (two black bars close vertically 0.25 s, open on next)", "dip to black"]
  pacing:
    bpm: [85, 110]
    rhythm: "Measured film rhythm: 6-8 beat shots, a crescendo sequence of 2-beat cuts, calm held ending."
  beat_response: ["Minimal: streak flares on downbeats of the crescendo only", "No pulse wrapper"]
  ui_choreography:
    - "Camera/audio settings dials rotate to values with power2.out 0.8 s"
    - "Settings readouts tick through values with odo()"
    - "Focus-tracking box snaps onto a subject (scale 1.3 -> 1, 0.3 s) and follows it"
  diagrams: ["Sensor or signal paths as thin glowing lines", "Frequency curves drawn from envKeys"]
  character_motion: ["No mascot"]
  captions: ["No pill; 42 px Be Vietnam Pro 500 ink with soft shadow, bottom band; current word ink, unread mute"]
  sound: ["Cinematic ambient with piano and strings, or refined electronic", "SFX: shutter clicks, lens focus ticks, soft whooshes on streaks"]
scene_types:
  prefer: [product-hero, montage, feature, quote, title]
  avoid: [terminal, code, chart]
signature_moves:
  - "Rack-focus handoff between scenes"
  - "Anamorphic streak wipe"
  - "Focus-tracking box locking onto the subject"
  - "Shutter-close cut"
strengths: ["Imaging and audio products", "Creator credibility", "Emotional cinematic tone"]
constraints:
  - "Max two blurred layers on screen at once"
  - "Type small and elegant; no headline above 80 px"
  - "Streaks and grain baked to PNG"
avoid: ["Flat vector illustration", "Bouncy UI", "Neon palettes"]
pairs_well_with: [cinematic-streaming, precision-hardware, music-editorial, sensory-tech]
