id: quirky-editorial
name: Quirky Editorial
family: brand-inspired
aliases: [mailchimp, mailchimp-like, mailchimp-style, quirky illustration]
summary: Offbeat editorial illustration; mustard fields, loose ink drawings, surreal cut-outs and witty serif headlines.
energy: 3
best_for: [small-business-promo, marketing-tool, brand-refresh, explainer]
character: >-
  Weird in a good way: loose hand-inked illustrations on warm mustard, surreal
  cut-out collages where objects do unexpected things, and a big friendly
  serif headline with a punchline. Creative, human and a little odd.
dimensions:
  palette:
    mode: light
    colors: {bg: "#f2c230", ink: "#1f1b17", accent: "#1a8072", cream: "#f6f0e4", coral: "#f2777a", sage: "#9eb28c", mute: "#6b5f55"}
    rule: "Mustard or cream backgrounds, ink linework; teal and coral as flat fills inside illustrations, never as backgrounds."
  typography:
    - "Fraunces 700 headlines 84 px, soft optical size, -0.02em"
    - "Manrope 500 body 30 px"
    - "Be Vietnam Pro 600 for captions"
  layout:
    - "Big serif headline left, illustration spilling off the right edge"
    - "Magazine spreads: one illustration, one line, lots of colour field"
  material: ["Flat colour fields with loose 3 px ink outlines (slightly wobbly SVG paths)", "Cut-out photo objects with white sticker border"]
  texture: ["Baked PNG risograph grain 8% over fills", "Pencil-texture strokes baked as PNG masks"]
  camera: ["Locked-off editorial frames; occasional slow pan across a wide illustration"]
  transitions: ["line redraw (ink outline of next scene draws on, fills flood in after, 0.7 s)", "cut-out slide (collage object slides across and becomes the next scene)", "colour field swap (mustard to cream with a soft wipe)", "surreal morph (object scales into another object)"]
  pacing:
    bpm: [95, 115]
    rhythm: "Conversational: 4-6 beat editorial frames, a pause before each punchline, quick 2-beat gag inserts."
  beat_response: ["Doodle accents (sparkles, squiggles) wiggle on beats", "Illustrated objects nod or tilt 4 deg on kicks", "No flashes"]
  ui_choreography:
    - "UI shown as hand-drawn wireframe that fills into a flat screenshot (line redraw then fill fade 0.4 s)"
    - "Email/card elements slide in with a playful 6 deg tilt then straighten (back.out 1.3)"
    - "Metrics in speech bubbles held by illustrated hands"
  diagrams: ["Hand-drawn arrows and loops (wobbly paths via draw())", "Venn and flow diagrams inked loosely with flat fills"]
  character_motion: ["Loose-drawn quirky characters and animals (original), moving on twos with a boiling-line effect from 3 baked frames"]
  captions: ["Cream box radius 6 with 3 px ink outline, 42 px Be Vietnam Pro 600 ink; current word teal"]
  sound: ["Quirky indie pop, ukulele, whistles, light percussion", "SFX: pencil scribbles, pops, cartoon boinks sparingly"]
scene_types:
  prefer: [hook, feature, quote, diagram, comparison, cta]
  avoid: [terminal, spec, montage]
signature_moves:
  - "Ink line redraw then colour flood"
  - "Boiling-line character on twos"
  - "Surreal object morph between scenes"
  - "Wireframe that fills into real UI"
strengths: ["Approachable marketing explainers", "Personality and wit", "Illustration-led storytelling"]
constraints:
  - "All characters original; no chimp mascot or look-alike"
  - "Ink outlines always present on illustrations"
  - "Textures baked to PNG"
avoid: ["Glossy 3D", "Dark tech palettes", "Hyper-fast cutting"]
pairs_well_with: [paper-cut-collage, functional-playful, character-comedy, playful-productivity]
